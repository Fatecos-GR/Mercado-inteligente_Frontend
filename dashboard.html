<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Dashboard - Admin Melior</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/pages/dashboard.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <!-- Layout Principal -->
    <div id="dashboard-layout">
      <!-- Sidebar -->
      <div id="admin-sidebar"></div>

      <div id="right-layout">
        <!-- Header de Admin -->
        <div id="admin-header"></div>

        <main id="main-container">
          <!-- Título -->
          <h2>Resumo das Operações</h2>

          <!-- Organização dos Cards -->
          <div id="dashboard-cards-grid">
            <div class="dashboard-card box-blue">
              <h3>Vendas do Dia</h3>
              <p>R$ 1.250,00</p>
            </div>

            <div class="dashboard-card box-green">
              <h3>Novos Pedidos</h3>
              <p>12</p>
            </div>

            <div class="dashboard-card box-red">
              <h3>Itens Esgotados</h3>
              <p>4</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
