<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melior | Carrinho</title>
    <link rel="stylesheet" href="css/base/global.css" />
    <link rel="stylesheet" href="css/base/colors.css" />
    <link rel="stylesheet" href="css/carrinho.css" />
  </head>
  <body>
    <main class="cart-container">
      <header class="cart-header">
        <h1>CARRINHO</h1>
        <div class="steps-container">
          <div class="step active">
            <span class="step-num">1</span>
            <p>Carrinho</p>
          </div>
          <div class="line"></div>
          <div class="step">
            <span class="step-num">2</span>
            <p>Identificação</p>
          </div>
          <div class="line"></div>
          <div class="step">
            <span class="step-num">3</span>
            <p>Pagamento</p>
          </div>
          <div class="line"></div>
          <div class="step">
            <span class="step-num">4</span>
            <p>Concluído</p>
          </div>
        </div>
      </header>

      <section class="cart-content">
        <div class="table-header">
          <span class="col-product">Produto</span>
          <span class="col-quantity">Quantidade</span>
          <span class="col-value">Valor</span>
        </div>

        <div class="cart-item">
          <div class="product-info">
            <img src="img/placeholder.png" alt="Produto" />
            <p class="product-name">Amido de Milho 200g</p>
          </div>
          <div class="quantity-controls">
            <button class="qty-btn">-</button>
            <input type="number" value="1" min="1" />
            <button class="qty-btn">+</button>
            <button class="remove-btn">🗑️ Remover</button>
          </div>
          <div class="value-info">
            <p class="price">R$ 4,50</p>
            <small>R$ 4,50 unid.</small>
          </div>
        </div>

        <footer class="cart-footer">
          <div class="shipping-calc">
            <p>🚚 Preencha o CEP para calcular o frete</p>
            <div class="cep-input">
              <input type="text" placeholder="Informe seu CEP" />
              <button class="btn-calc">Calcular</button>
            </div>
          </div>

          <div class="cart-summary">
            <div class="total-row">
              <span>TOTAL</span>
              <span class="total-price">R$ 4,50</span>
            </div>
            <div class="actions">
              <a href="index.html" class="continue-link">Continuar Comprando</a>
              <button class="btn-finalize">Finalizar Compra</button>
            </div>
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
