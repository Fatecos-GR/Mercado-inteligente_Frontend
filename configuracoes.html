              <div class="tab-content active" id="tab-perfil">
                <div class="admin-form-row">
                  <div class="admin-form-group">
                    <label for="perfil-nome">Nome</label>

                    <input type="text" id="perfil-nome" required />
                  </div>

                  <div class="admin-form-group">
                    <label for="perfil-sobrenome">Sobrenome</label>

                    <input type="text" id="perfil-sobrenome" required />
                  </div>
                </div>

                <div class="admin-form-row">
                  <div class="admin-form-group">
                    <label for="perfil-email">Seu E-mail de Acesso</label>
                    <input
                      type="email"
                      id="perfil-email"
                      name="perfilEmail"
                      value="admin@melior.com"
                    />
                  </div>

                  <div class="admin-form-group">
                    <label for="perfil-telefone">Seu Telefone</label>
                    <input
                      type="tel"
                      id="perfil-telefone"
                      name="perfilTelefone"
                      placeholder="(11) 99999-9999"
                    />
                  </div>

                  <div class="admin-form-group">
                    <label for="perfil-cargo">Cargo / Função</label>
                    <input
                      type="text"
                      id="perfil-cargo"
                      value="Administrador Geral"
                      disabled
                      style="
                        background-color: rgba(0, 0, 0, 0.03);
                        cursor: not-allowed;
                      "
                    />
                  </div>
                </div>

                <div class="admin-form-group">
                  <label for="perfil-senha">Alterar Senha de Acesso</label>

                  <div class="input-container">
                    <input
                      type="password"
                      id="perfil-senha"
                      name="perfilSenha"
                      placeholder="Digite uma nova senha se desejar alterar"
                    />

                    <button
                      type="button"
                      class="btn-toggle-password"
                      tabindex="-1"
                    >
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
              </div>
