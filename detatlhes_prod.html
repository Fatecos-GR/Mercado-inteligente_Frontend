<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melior | Detalhes do Produto</title>
    <link rel="stylesheet" href="css/base/global.css" />
    <link rel="stylesheet" href="css/base/colors.css" />
    <link rel="stylesheet" href="css/detalhes_prod.css" />
  </head>
  <body>
    <main class="product-view-container">
      <section class="product-gallery">
        <div class="badge-frete">FRETE GRÁTIS</div>
        <img src="img/placeholder.png" alt="Kit Bicho Green" class="main-img" />
      </section>

      <section class="product-details">
        <h1 class="product-title">
          [ FRETE GRÁTIS ] - KIT BICHO GREEN GATO 7KG + AREIA CATS BEST 4,3KG
        </h1>

        <div class="rating">
          ⭐⭐⭐⭐⭐ <span class="rating-count">(1)</span>
        </div>

        <div class="price-container">
          <h2 class="current-price">R$ 290,80</h2>
          <p class="installments">3x de R$ 96,93 sem juros</p>
        </div>

        <div class="product-actions">
          <div class="quantity-selector">
            <button class="qty-btn">-</button>
            <input type="number" value="1" min="1" />
            <button class="qty-btn">+</button>
          </div>
          <button class="btn-buy">COMPRAR</button>
        </div>

        <div class="shipping-section">
          <p class="shipping-title">🚚 Meios de envio</p>
          <div class="shipping-input">
            <input type="text" placeholder="Seu CEP" />
            <button class="btn-calc">CALCULAR</button>
          </div>
          <a href="#" class="no-cep">Não sei meu CEP</a>
        </div>
      </section>
    </main>
  </body>
</html>
