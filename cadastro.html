<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Melior | Criar Conta</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS BASE + COMPONENTES -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/pages/cadastro.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="login-page-wrapper">
      <div class="glass-container">
        <div class="right-side">
          <form class="login-form">
            <h2>CRIAR CONTA</h2>

            <div class="input-group">
              <span class="icon">👤</span>
              <input type="text" placeholder="NOME COMPLETO" required />
            </div>

            <div class="input-group">
              <span class="icon">📧</span>
              <input type="email" placeholder="E-MAIL" required />
            </div>

            <div class="input-group">
              <span class="icon">🔒</span>
              <input type="password" placeholder="SENHA" required />
            </div>

            <div class="input-group">
              <span class="icon">🛡️</span>
              <input type="password" placeholder="CONFIRMAR SENHA" required />
            </div>

            <button type="submit" class="btn-primary">
              Finalizar Cadastro
            </button>

            <div class="social-footer">
              <span>f</span> <span>i</span> <span>t</span>
            </div>
          </form>
        </div>

        <div class="left-side">
          <div class="welcome-content">
            <h2>JÁ TEM CONTA?</h2>
            <p class="highlight-text">Melior Mercado</p>
            <p id="temp-text">Acesse sua conta para continuar suas compras.</p>
            <a href="login.html"
              ><button class="btn-secondary">Fazer Login</button></a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
