<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melior | Criar Conta</title>
    <link rel="stylesheet" href="css/base/global.css" />
    <link rel="stylesheet" href="css/base/colors.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page-wrapper">
      <div class="glass-container">
        <div class="right-side">
          <form class="login-form">
            <h2>CRIAR CONTA</h2>

            <div class="input-group">
              <span class="icon">👤</span>
              <input type="text" placeholder="NOME COMPLETO" required />
            </div>

            <div class="input-group">
              <span class="icon">📧</span>
              <input type="email" placeholder="E-MAIL" required />
            </div>

            <div class="input-group">
              <span class="icon">🔒</span>
              <input type="password" placeholder="SENHA" required />
            </div>

            <div class="input-group">
              <span class="icon">🛡️</span>
              <input type="password" placeholder="CONFIRMAR SENHA" required />
            </div>

            <button type="submit" class="btn-primary">
              Finalizar Cadastro
            </button>

            <div class="social-footer">
              <span>f</span> <span>i</span> <span>t</span>
            </div>
          </form>
        </div>

        <div class="left-side">
          <div class="welcome-content">
            <h2>JÁ TEM CONTA?</h2>
            <p class="highlight-text">Melior Mercado</p>
            <p style="margin-bottom: 20px; color: var(--primary-color)">
              Acesse sua conta para continuar suas compras.
            </p>
            <a href="login.html"
              ><button class="btn-secondary">Fazer Login</button></a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
