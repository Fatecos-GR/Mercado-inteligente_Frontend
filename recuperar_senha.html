<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título da página -->
    <title>Melior | Recuperar Senha</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS BASE + COMPONENTES -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/pages/recuperar_senha.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="login-page-wrapper">
      <div class="glass-container single-column">
        <div class="right-side">
          <form class="login-form">
            <h2>RECUPERAR ACESSO</h2>
            <p>
              Insira seu e-mail cadastrado e enviaremos um link para você criar
              uma nova senha.
            </p>

            <div class="input-group">
              <span class="icon"></span>
              <input
                type="email"
                placeholder="SEU E-MAIL DE CADASTRO"
                required
              />
            </div>

            <button type="submit" class="btn-primary">
              Enviar Link de Recuperação
            </button>

            <div id="login-return">
              <a href="login.html"> ← Voltar para o Login </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
