<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melior | Meu Perfil</title>

    <!-- Link do FontAwesome para carregar os ícones do menu lateral -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Seus arquivos CSS -->
    <link rel="stylesheet" href="../css/base/global.css" />
    <link rel="stylesheet" href="../css/base/colors.css" />
    <link rel="stylesheet" href="../css/pages/perfil.css" />
  </head>
  <body>
    <!-- Link do Header -->
    <header id="main-header"></header>

    <div class="profile-container">
      <!-- MENU LATERAL -->
      <aside class="profile-sidebar">
        <nav class="profile-nav">
          <a href="#" class="active">
            <i class="fa-regular fa-user"></i> Dados Pessoais
          </a>
          <a href="#"> <i class="fa-solid fa-house"></i> Endereços </a>
          <a href="#"> <i class="fa-solid fa-truck-fast"></i> Meus Pedidos </a>
          <a href="#"> <i class="fa-regular fa-credit-card"></i> Cartões </a>
          <a href="#"> <i class="fa-regular fa-heart"></i> Minhas Listas </a>
          <a href="#"> <i class="fa-regular fa-bell"></i> Meus Alertas </a>

          <hr class="nav-divider" />

          <a href="index.html" class="logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
          </a>
        </nav>
      </aside>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="profile-content">
        <h2 class="section-title">Dados cadastrais</h2>

        <div class="data-card">
          <div class="data-grid">
            <!-- Linha 1 -->
            <div class="data-field col-5">
              <label>Nome completo</label>
              <!-- O ID ajudará o JavaScript a injetar o nome do usuário logado -->
              <div class="field-value" id="user-nome">Nome do Usuário</div>
            </div>
            <div class="data-field col-4">
              <label>CPF/CNPJ</label>
              <div class="field-value" id="user-doc">000.000.000-00</div>
            </div>
            <div class="data-field col-3">
              <label>RG</label>
              <div class="field-value" id="user-rg">00.000.000-0</div>
            </div>

            <!-- Linha 2 -->
            <div class="data-field col-4">
              <label>Data de nascimento</label>
              <div class="field-value" id="user-nascimento">DD/MM/AAAA</div>
            </div>
            <div class="data-field transparent col-4">
              <label>Gênero</label>
              <div class="field-value" id="user-genero">
                Selecione uma opção
              </div>
            </div>
            <div class="data-field col-4">
              <label>Celular</label>
              <div class="field-value" id="user-celular">(00) 00000-0000</div>
            </div>

            <!-- Linha 3 -->
            <div class="data-field col-6">
              <label>E-mail</label>
              <div class="field-value" id="user-email">usuario@email.com</div>
            </div>
          </div>

          <!-- Preferências de Notificação -->
          <div class="preferences">
            <label class="checkbox-label">
              <input type="checkbox" id="pref-sms" />
              Quero receber ofertas incríveis por SMS.
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="pref-email" />
              Quero receber ofertas incríveis por e-mail.
            </label>
          </div>
        </div>

        <button class="btn-edit-data">Editar dados</button>
      </main>
    </div>

    <!-- Rodapé -->
    <footer id="main-footer"></footer>
  </body>
</html>
