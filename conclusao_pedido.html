<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título da página -->
    <title>Melior | Pedido Concluido</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS BASE + COMPONENTES -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/pages/conclusao_pedido.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="success-container">
      <header class="cart-header">
        <div class="steps-container">
          <div class="step">
            <span class="step-num">✔</span>
            <p>Carrinho</p>
          </div>
          <div class="line completed"></div>
          <div class="step">
            <span class="step-num">✔</span>
            <p>Identificação</p>
          </div>
          <div class="line completed"></div>
          <div class="step">
            <span class="step-num">✔</span>
            <p>Pagamento</p>
          </div>
          <div class="line completed"></div>
          <div class="step active">
            <span class="step-num">4</span>
            <p>Concluído</p>
          </div>
        </div>
      </header>

      <section class="success-card">
        <div class="success-icon"></div>
        <h1>PEDIDO REALIZADO!</h1>
        <p class="order-number">
          O número do seu pedido é <strong>#1052</strong>
        </p>

        <p class="message">
          Obrigado por comprar no <strong>Melior Mercado</strong>!<br />
          Enviamos um e-mail com todos os detalhes da sua compra.
        </p>

        <div class="next-steps">
          <a href="perfil.html" class="btn-outline">Acompanhar Pedido</a>
          <a href="index.html" class="btn-primary">Voltar para a Loja</a>
        </div>
      </section>
    </main>
  </body>
</html>
