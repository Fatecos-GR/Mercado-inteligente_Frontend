<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Funcionário | Admin Melior</title>
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/pages/add_funcionario.css" />
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <div id="adicionar-funcionario-layout">
      <div id="admin-sidebar"></div>

      <div id="right-layout">
        <div id="admin-header"></div>

        <main id="main-container">
          <div class="admin-form-wrapper">
            <a href="usuarios.html" class="admin-btn-back"
              >Voltar para a listagem</a
            >
            <h2>Cadastrar Novo Funcionário</h2>

            <form
              action="/admin/funcionarios/salvar"
              method="POST"
              class="admin-main-form"
            >
              <div class="admin-form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required />
              </div>

              <div class="admin-form-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" name="email" required />
              </div>

              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label for="celular">Celular / WhatsApp</label>
                  <input
                    type="tel"
                    id="celular"
                    name="celular"
                    placeholder="(11) 99999-9999"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="cpf">CPF</label>
                  <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    required
                  />
                </div>
              </div>

              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label for="cep">CEP</label>
                  <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="estado-civil">Estado Civil</label>
                  <select id="estado-civil" name="estadoCivil" required>
                    <option value="">Selecione...</option>
                    <option value="SOLTEIRO">Solteiro(a)</option>
                    <option value="CASADO">Casado(a)</option>
                    <option value="DIVORCIADO">Divorciado(a)</option>
                    <option value="VIUVO">Viúvo(a)</option>
                  </select>
                </div>
              </div>

              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label for="cargo">Cargo / Função</label>
                  <input
                    type="text"
                    id="cargo"
                    name="cargo"
                    placeholder="Ex: Operador de Caixa"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="acesso">Nível de Acesso</label>
                  <select id="acesso" name="acesso" required>
                    <option value="">Selecione...</option>
                    <option value="OPERADOR">Operador</option>
                    <option value="ADMIN">Administrador</option>
                  </select>
                </div>
              </div>

              <div class="admin-form-group">
                <label for="senha">Senha Inicial</label>
                <input type="password" id="senha" name="senha" required />
              </div>

              <div class="admin-form-actions">
                <button type="submit" class="admin-btn-submit">
                  Salvar Funcionário
                </button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
