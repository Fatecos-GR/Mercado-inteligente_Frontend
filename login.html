<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Melior | Login</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS BASE + COMPONENTES -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet" href="css/pages/login.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="login-page-wrapper">
      <div class="glass-container">
        <div class="left-side">
          <div class="welcome-content">
            <h2>BEM VINDO</h2>
            <p class="highlight-text">Novo Login</p>
            <button class="btn-secondary">Criar conta</button>

            <div class="social-login-small">
              <span>G</span> <span>T</span> <span>W</span>
            </div>
          </div>
        </div>

        <div class="right-side">
          <form class="login-form">
            <h2>FAÇA LOGIN</h2>

            <div class="input-group">
              <span class="icon">👤</span>
              <input type="text" placeholder="USUÁRIO" required />
            </div>

            <div class="input-group">
              <span class="icon">🔒</span>
              <input type="password" placeholder="******" required />
              <span class="icon-eye">👁️</span>
            </div>

            <div class="form-options">
              <label><input type="checkbox" /> Lembrar</label>
              <a href="recuperar_senha.html"
                >Esqueceu senha?
                <button type="submit" class="btn-primary">Entrar</button>
              </a>
            </div>

            <div class="social-footer">
              <span>f</span> <span>i</span> <span>t</span>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
