<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Melior | Login</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/pages/login.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <header id="main-header"></header>

    <main class="login-main">
      <section class="login-container">
        <!-- Lado de Boas-vindas (Identidade Visual) -->
        <div class="login-info-section">
          <div class="info-content">
            <h2 class="info-title">Bem-vindo</h2>
            <p class="info-brand">Mercado Inteligente</p>
            <p class="info-description">
              Ainda não tem uma conta? Junte-se a nós para uma experiência de
              compra única e acolhedora.
            </p>
            <a href="cadastro.html" id="btn-cadastro" class="btn-secondary"
              >Criar Conta</a
            >
          </div>
        </div>

        <!-- Lado do Formulário -->
        <div class="login-form-section">
          <form class="login-form" novalidate>
            <h1 class="form-title">Faça Login</h1>

            <!-- Email -->
            <div class="input-container">
              <label for="username" class="sr-only"> E-mail </label>

              <div class="input-wrapper">
                <i class="fas fa-user"></i>

                <input
                  type="email"
                  id="email"
                  placeholder="Digite seu e-mail"
                  autocomplete="off"
                />
              </div>

              <span class="field-error"> Informe um e-mail válido. </span>
            </div>

            <!-- Senha -->
            <div class="input-container">
              <label for="password" class="sr-only"> Senha </label>

              <div class="input-wrapper">
                <i class="fas fa-lock"></i>

                <input
                  type="password"
                  id="password"
                  placeholder="Digite sua senha"
                  autocomplete="off"
                />

                <div class="btn-toggle-password">
                  <i class="fas fa-eye"></i>
                </div>
              </div>

              <span class="field-error"> Informe sua senha. </span>
            </div>
            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" />
                <span>Lembrar-me</span>
              </label>
              <a href="recuperar_senha.html" class="forgot-password"
                >Esqueceu a senha?</a
              >
            </div>

            <div class="form-message">Usuário ou senha inválidos.</div>

            <button type="submit" class="btn-primary">Entrar</button>

            <!-- Rodapé com login social padronizado -->
            <div class="form-footer">
              <p>Ou entre com</p>
              <div class="social-icons">
                <button type="button" class="btn-social">
                  <i class="fab fa-google"></i>
                </button>
                <button type="button" class="btn-social">
                  <i class="fab fa-facebook-f"></i>
                </button>
                <button type="button" class="btn-social">
                  <i class="fab fa-twitter"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
