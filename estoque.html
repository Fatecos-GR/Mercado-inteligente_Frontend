<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Estoque | Admin Melior</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/pages/estoque.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <div id="estoque-layout">
      <!-- Sidebar -->
      <div id="admin-sidebar"></div>

      <div id="right-layout">
        <!-- Header -->
        <div id="admin-header"></div>

        <main id="main-container">
          <!-- TOPO -->
          <section id="estoque-header">
            <h2>Estoque</h2>
            <div id="estoque-actions">
              <div class="estoque-search-area">
                <!-- BARRA DE BUSCA -->
                <div id="search-produto-container">
                  <i class="fa-solid fa-magnifying-glass"></i>

                  <input
                    type="text"
                    id="search-produto"
                    placeholder="Buscar produto..."
                  />
                </div>
              </div>

              <!-- BOTÃO -->
              <a href="adicionar_produto.html" id="btn-adicionar-produto">
                <i class="fa-solid fa-plus"></i>
                Novo Produto
              </a>
            </div>

            <!-- Título da parte de baixo -->
            <h2>Produtos Cadastrados</h2>
          </section>

          <!-- LISTA DE PRODUTOS -->
          <section class="admin-products-grid">
            <!-- CARD -->
            <article class="product-card">
              <div class="product-card-top">
                <div class="product-icon">
                  <i class="fa-solid fa-box"></i>
                </div>

                <div class="product-status">Em estoque</div>
              </div>

              <div class="product-info">
                <h3>Arroz Integral 5kg</h3>
                <span class="product-category"> Alimentos </span>
              </div>

              <div class="product-details">
                <div class="detail-item">
                  <span>Preço</span>
                  <strong>R$ 22,90</strong>
                </div>

                <div class="detail-item">
                  <span>Quantidade</span>
                  <strong>50 un.</strong>
                </div>
              </div>

              <div class="product-actions">
                <a href="#" class="btn-edit">
                  <i class="fa-solid fa-pen"></i>
                  Editar
                </a>

                <a href="#" class="btn-delete">
                  <i class="fa-solid fa-trash"></i>
                  Excluir
                </a>
              </div>
            </article>

            <!-- CARD -->
            <article class="product-card">
              <div class="product-card-top">
                <div class="product-icon">
                  <i class="fa-solid fa-bottle-water"></i>
                </div>

                <div class="product-status warning">Baixo estoque</div>
              </div>

              <div class="product-info">
                <h3>Água Mineral 1L</h3>
                <span class="product-category"> Bebidas </span>
              </div>

              <div class="product-details">
                <div class="detail-item">
                  <span>Preço</span>
                  <strong>R$ 4,50</strong>
                </div>

                <div class="detail-item">
                  <span>Quantidade</span>
                  <strong>8 un.</strong>
                </div>
              </div>

              <div class="product-actions">
                <a href="#" class="btn-edit">
                  <i class="fa-solid fa-pen"></i>
                  Editar
                </a>

                <a href="#" class="btn-delete">
                  <i class="fa-solid fa-trash"></i>
                  Excluir
                </a>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
