<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Cadastro de Produto | Admin Melior</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/pages/adicionar_produto.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <div id="adicionar-produto-layout">
      <!-- Sidebar -->
      <div id="admin-sidebar"></div>

      <div id="right-layout">
        <!-- Header -->
        <div id="admin-header"></div>

        <!-- Conteúdo Principal -->
        <main id="main-container">
          <div class="admin-page-header">
            <a href="estoque.html" class="admin-btn-back">
              <i class="fa-solid fa-arrow-left"></i>
            </a>

            <h2>Formulário de Cadastro</h2>
          </div>

          <div class="admin-form-wrapper">
            <form class="admin-main-form">
              <!-- NOME -->
              <div class="admin-form-group">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" name="nome" required />
              </div>

              <!-- DESCRIÇÃO -->
              <div class="admin-form-group">
                <label for="descricao">Descrição</label>
                <textarea
                  id="descricao"
                  name="descricao"
                  rows="4"
                  required
                ></textarea>
              </div>

              <!-- PREÇO + ESTOQUE -->
              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label for="preco">Preço de Venda</label>
                  <input
                    type="number"
                    id="preco"
                    name="preco"
                    step="0.01"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="estoqueDisponivel">Estoque Disponível</label>
                  <input
                    type="number"
                    id="estoqueDisponivel"
                    name="estoqueDisponivel"
                    required
                  />
                </div>
              </div>

              <!-- VALIDADE -->
              <div class="admin-form-group">
                <label for="validade">Validade</label>
                <input type="date" id="validade" name="validade" />
              </div>

              <!-- MARCA / CATEGORIA / FORNECEDOR -->
              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label for="marcaId">Marca</label>
                  <select id="marcaId" name="marcaId" required>
                    <option value="">Carregando marcas...</option>
                  </select>
                </div>

                <div class="admin-form-group">
                  <label for="categoriaId">Categoria</label>
                  <select id="categoriaId" name="categoriaId" required>
                    <option value="">Carregando categorias...</option>
                  </select>
                </div>

                <div class="admin-form-group">
                  <label for="fornecedorId">Fornecedor</label>
                  <select id="fornecedorId" name="fornecedorId" required>
                    <option value="">Carregando Fornecedores...</option>
                  </select>
                </div>
              </div>

              <!-- IMAGEM -->
              <div class="admin-form-group">
                <label for="imagem">Imagem do Produto</label>
                <input type="file" id="imagem" name="imagem" accept="image/*" />
              </div>

              <!-- BOTÃO -->
              <div class="admin-form-actions">
                <button type="submit" class="admin-btn-submit">
                  Salvar Produto
                </button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
