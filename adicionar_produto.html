<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>Cadastro de Produto | Admin Melior</title>

    <!-- Ícone da página -->
    <link rel="shortcut icon" href="img/placeholder.png" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/pages/adicionar_produto.css" />

    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <div id="adicionar-produto-layout">
      <!-- Sidebar -->
      <div id="admin-sidebar"></div>

      <div id="right-layout">
        <!-- Header -->
        <div id="admin-header"></div>

        <!-- Conteúdo Principal -->
        <main id="main-container">
          <h2>Formulario de Cadastro</h2>
          <a href="estoque.html" class="admin-btn-back">Voltar</a>

          <div class="admin-form-wrapper">
            <form
              action="/admin/produtos/salvar"
              method="POST"
              class="admin-main-form"
            >
              <div class="admin-form-group">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" name="nome" required />
              </div>

              <div class="admin-form-row">
                <div class="admin-form-group">
                  <label for="preco">Preco de Venda</label>
                  <input
                    type="number"
                    id="preco"
                    name="preco"
                    step="0.01"
                    required
                  />
                </div>
                <div class="admin-form-group">
                  <label for="quantidade">Quantidade Inicial</label>
                  <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    required
                  />
                </div>
              </div>

              <div class="admin-form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                  <option value="">Selecione...</option>
                  <option value="alimentos">Alimentos</option>
                  <option value="bebidas">Bebidas</option>
                  <option value="limpeza">Limpeza</option>
                  <option value="higiene">Higiene</option>
                </select>
              </div>

              <div class="admin-form-actions">
                <button type="submit" class="admin-btn-submit">
                  Salvar Registro
                </button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
