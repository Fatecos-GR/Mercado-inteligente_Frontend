          <!-- Aba: Dados Pessoais -->
          <section id="tab-dados" class="content-section">
            <h2 class="section-title">Dados Cadastrais</h2>

            <form id="form-perfil" class="profile-form">
              <div class="profile-data-card">
                <div class="data-grid-layout">
                  <div class="data-field col-span-5">
                    <label for="user-nome">Nome</label>
                    <input
                      type="text"
                      class="field-input"
                      id="perfil-nome"
                      value="Nome do Usuário"
                      disabled
                    />
                  </div>
                  <div class="data-field col-span-4">
                    <label for="user-sobrenome">Sobrenome</label>
                    <input
                      type="text"
                      class="field-input"
                      id="perfil-sobrenome"
                      value="Sobrenome do usuário"
                      disabled
                    />
                  </div>

                  <div class="data-field col-span-4">
                    <label for="user-celular">Celular</label>
                    <input
                      type="tel"
                      class="field-input"
                      id="perfil-telefone"
                      value="(00) 00000-0000"
                      disabled
                    />
                  </div>

                  <div class="data-field col-span-6">
                    <label for="user-email">E-mail</label>
                    <input
                      type="email"
                      class="field-input"
                      id="user-email"
                      value="usuario@email.com"
                      disabled
                    />
                  </div>
                  <div class="data-field col-span-6">
                    <label for="perfil-senha">Nova Senha</label>

                    <div class="password-wrapper">
                      <input
                        type="password"
                        class="field-input"
                        id="perfil-senha"
                        placeholder="Digite uma nova senha"
                        disabled
                      />

                      <button
                        type="button"
                        class="btn-toggle-password"
                        data-target="perfil-senha"
                        tabindex="-1"
                      >
                        <i class="fa-regular fa-eye"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <button type="button" class="btn-edit-profile">
                Editar dados
              </button>
            </form>
          </section>

          <!-- Aba: Endereços -->
          <section
            id="tab-enderecos"
            class="content-section"
            style="display: none"
          >
            <h2 class="section-title">Meu Endereço</h2>

            <form id="form-endereco">
              <div class="profile-data-card">
                <div class="data-grid-layout">
                  <div class="data-field col-span-3">
                    <label>CEP</label>
                    <input type="text" id="cep" class="field-input" />
                  </div>

                  <div class="data-field col-span-6">
                    <label>Logradouro</label>
                    <input type="text" id="logradouro" class="field-input" />
                  </div>

                  <div class="data-field col-span-3">
                    <label>Número</label>
                    <input type="text" id="numero" class="field-input" />
                  </div>

                  <div class="data-field col-span-6">
                    <label>Complemento</label>
                    <input type="text" id="complemento" class="field-input" />
                  </div>

                  <div class="data-field col-span-4">
                    <label>Bairro</label>
                    <input type="text" id="bairro" class="field-input" />
                  </div>

                  <div class="data-field col-span-4">
                    <label>Cidade</label>
                    <input type="text" id="cidade" class="field-input" />
                  </div>

                  <div class="data-field col-span-2">
                    <label>Estado</label>
                    <input type="text" id="estado" class="field-input" />
                  </div>
                </div>

                <button
                  type="button"
                  id="btn-salvar-endereco"
                  class="btn-edit-profile"
                >
                  Salvar endereço
                </button>
              </div>
            </form>
          </section>
